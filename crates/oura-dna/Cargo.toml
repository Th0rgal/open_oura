[package]
name = "oura-dna"
description = "Read consumer / whole-genome VCF (.vcf.gz) and score traits + polygenic risk against a local, editable catalog"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
